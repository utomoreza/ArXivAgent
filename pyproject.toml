[project]
name = "arxiv-agent"
version = "0.1.0"
description = "ArXiv Intelligence Agent — monitors ML research papers and synthesizes insights"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    # Scheduler
    "apscheduler==3.11.2",
    # Database / ORM
    "sqlalchemy==2.0.49",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "pgvector==0.4.2",
    # arXiv & HTTP
    "arxiv==3.0.0",
    "httpx==0.28.1",
    "pdfplumber==0.11.9",
    # Embeddings
    "sentence-transformers==5.4.1",
    # LLM
    "anthropic==0.97.0",
    "greenlet>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",       # also used as AsyncClient in tests
    "ruff==0.15.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
index-url = "https://pypi.org/simple"
dev-dependencies = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html:htmlcov --cov-branch"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]
ignore = []

[tool.coverage.run]
source = ["src"]
branch = true
concurrency = ["greenlet", "thread"]
omit = [
    "src/migrations/*",
    "src/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]  # long assertion messages in tests are intentional
"src/migrations/**/*.py" = ["E501"]  # migration files have long constraint/column lines
"src/db/models.py" = ["E501"]  # module docstring contains ASCII art diagram
