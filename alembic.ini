# Alembic configuration for ArXivAgent.
# Run migrations: uv run alembic upgrade head
# Generate new revision: uv run alembic revision --autogenerate -m "description"

[alembic]
script_location = src/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC
# URL is overridden by env.py from the DATABASE_URL environment variable
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
